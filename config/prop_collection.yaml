# Multi-sport player-prop odds collection config (research-only).
#
# This file only controls *data collection*. It does not enable any models,
# recommendations, approved bets, or approved parlays.
#
# Leagues: NBA is the modeling priority; every other league is collect_only
# (build the historical database now, model later). Soccer leagues are
# collect_only: no soccer models exist or are planned yet.

schema_version: 1
research_only: true

defaults:
  # Only collect props for games starting within this many hours from now.
  event_horizon_hours: 36
  # Snapshots taken within this many minutes before game start are closing-like.
  closing_window_minutes: 60
  # Per-league cap on event-odds requests per run (Odds API free tier ~500 req/mo;
  # player-prop markets cost extra credits, so keep this small). Each league may
  # override with its own max_events_per_run.
  max_events_per_league_per_run: 6
  # Quota protection: at most this many leagues actually collect per run,
  # taken in priority order (lower priority number first). 0 = no cap.
  max_leagues_per_run: 8

# Quota protection: The Odds API reports remaining credits in the
# x-requests-remaining response header. Once it drops below
# min_remaining_requests, every remaining league in the run is skipped.
# low_priority_min_remaining is a stricter floor for collect-only
# (non-modeling-priority) leagues: when quota looks limited they are skipped
# first so NBA closing collection keeps running. Modeling-priority leagues
# (NBA) always collect first in the run ordering. 0 disables a guard.
quota:
  min_remaining_requests: 25
  low_priority_min_remaining: 50

# Catch-up behavior: if the previous run finished more than this many hours
# ago, the run logs an explicit missed-collection warning. Missed odds are NOT
# recoverable (the API has no historical odds on the current plan); collection
# simply continues from now.
catch_up:
  max_gap_hours: 24

# Informational: suggested local run times, used by the Task Scheduler guide
# (scripts/windows_task_scheduler_setup.md). The collector itself runs once per
# invocation; schedule it at these times to capture line movement.
collection_windows:
  morning: "09:00"
  midday: "13:00"
  early_evening: "17:30"
  pre_tip: "18:30"

closing_snapshot:
  window_minutes: 60

output:
  raw_dir: data/raw/prop_odds
  processed_path: data/processed/player_prop_snapshots_normalized.csv
  run_summary_path: data/reports/player_prop_collection_run_summary.json
  run_log_dir: data/logs/prop_collection_runs
  # Append-only one-line-JSON record per run; powers the health report.
  run_history_path: data/reports/prop_collection_run_history.jsonl

sources:
  odds_api:
    enabled: true
    api_key_env: ODDS_API_KEY
    base_url: https://api.the-odds-api.com/v4
    regions: us
    odds_format: decimal
  kalshi:
    # Planned: Kalshi prop tickers (KXNBAPTS/KXNBAREB/...) are not wired into
    # this collector yet; the run skips unimplemented sources gracefully.
    enabled: false

# markets maps the source-native market key -> canonical prop_type
# (src/data/player_prop_schema.py PROP_TYPES).
# priority: collection order under quota pressure (lower = collected first).
leagues:
  NBA:
    sport: basketball
    enabled: true
    modeling_priority: true
    collect_only: false
    priority: 1
    sources:
      odds_api:
        sport_key: basketball_nba
        markets:
          player_points: points
          player_rebounds: rebounds
          player_assists: assists
          player_threes: threes
  WNBA:
    sport: basketball
    enabled: true
    modeling_priority: false
    collect_only: true
    priority: 2
    sources:
      odds_api:
        sport_key: basketball_wnba
        markets:
          player_points: points
          player_rebounds: rebounds
          player_assists: assists
  MLB:
    sport: baseball
    enabled: true
    modeling_priority: false
    collect_only: true
    priority: 3
    sources:
      odds_api:
        sport_key: baseball_mlb
        markets:
          batter_hits: hits
          batter_home_runs: home_runs
          batter_total_bases: total_bases
